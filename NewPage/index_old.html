<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Analytics | Profile Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#071a30; --navy2:#102c4a; --cyan:#a5f2fa; --teal:#69dce7; --white:#f5fbff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#e8eef4; font-family:Inter,Arial,sans-serif; }
    .banner { position:relative; isolation:isolate; overflow:hidden; width:min(100%,1536px); min-height:360px; color:var(--white); background:linear-gradient(110deg,#0b1d34 0%,#071b30 50%,#123958 100%); box-shadow:0 22px 55px #0a27402b; }
    .banner::before { content:""; position:absolute; inset:-300px 32% -150px -25%; z-index:-1; border-radius:50%; border:110px solid #315e8d55; transform:rotate(-26deg); }
    .banner::after { content:""; position:absolute; width:580px; height:580px; right:-230px; top:-285px; z-index:-1; border-radius:50%; background:radial-gradient(circle,#b6f4ff25 0%,#418cc130 38%,transparent 68%); }
    .swoosh { position:absolute; z-index:-1; width:900px; height:250px; left:-180px; bottom:-195px; background:linear-gradient(110deg,#5ba8d7b0,#80e4ed90,#2c7cb030); transform:rotate(18deg); border-radius:50%; filter:blur(1px); }
    .content { display:flex; position:relative; z-index:2; align-items:center; gap:54px; padding:42px 54px; max-width:1200px; }
    .portrait { flex:0 0 265px; width:265px; height:265px; border:5px solid #8ce6ef; border-radius:50%; background:linear-gradient(145deg,#244f70,#132e4c); display:grid; place-items:center; overflow:hidden; box-shadow:0 12px 35px #0004; }
    .portrait img { width:100%; height:100%; object-fit:cover; }
    .portrait-placeholder { text-align:center; color:#b6dbe5; font-size:14px; line-height:1.7; }
    .portrait-placeholder svg { display:block; margin:0 auto 10px; opacity:.75; }
    .copy { min-width:0; }
    .eyebrow { color:#b3eaf3; letter-spacing:.35em; text-transform:uppercase; font-size:16px; font-weight:500; margin:0 0 16px; }
    h1 { font-size:clamp(35px,4vw,59px); letter-spacing:-.045em; line-height:1.07; margin:0 0 14px; font-weight:800; }
    h1 span { display:block; color:var(--cyan); }
    .subtitle { margin:0; font-size:clamp(15px,1.6vw,23px); line-height:1.5; color:#f1f7ff; }
    .features { display:flex; flex-wrap:wrap; align-items:center; gap:28px; margin-top:34px; }
    .feature { display:flex; align-items:center; gap:13px; font-size:15px; line-height:1.5; white-space:nowrap; }
    .feature svg { flex:none; width:35px; height:35px; stroke:#b9f6ff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .chart { position:absolute; right:0; bottom:0; width:360px; height:275px; opacity:.75; z-index:1; pointer-events:none; mask-image:linear-gradient(90deg,transparent,#000 30%); }
    .chart .bar { fill:#67dce9; opacity:.55; }
    .chart .curve { fill:none; stroke:#bdf8ff; stroke-width:2.5; }
    .chart .dot { fill:#a3f7ff; }
    @media (max-width:1100px) { .content { gap:30px; padding:36px; } .portrait { flex-basis:190px; width:190px; height:190px; } .chart { opacity:.3; } }
    @media (max-width:700px) { body { padding:12px; } .content { flex-direction:column; align-items:flex-start; gap:22px; padding:28px; } .portrait { width:140px; height:140px; flex-basis:140px; } .eyebrow { font-size:11px; } h1 { font-size:36px; } .features { gap:16px; } .feature { font-size:13px; } .chart { width:250px; opacity:.2; } }
  </style>
</head>
<body>
  <header class="banner" aria-label="Professional profile banner">
    <div class="swoosh"></div>
    <svg class="chart" viewBox="0 0 360 275" aria-hidden="true">
      <g>
        <rect class="bar" x="15" y="211" width="23" height="64" rx="3"/><rect class="bar" x="52" y="180" width="23" height="95" rx="3"/><rect class="bar" x="89" y="225" width="23" height="50" rx="3"/><rect class="bar" x="126" y="153" width="23" height="122" rx="3"/><rect class="bar" x="163" y="188" width="23" height="87" rx="3"/><rect class="bar" x="200" y="120" width="23" height="155" rx="3"/><rect class="bar" x="237" y="145" width="23" height="130" rx="3"/><rect class="bar" x="274" y="90" width="23" height="185" rx="3"/><rect class="bar" x="311" y="55" width="23" height="220" rx="3"/>
      </g>
      <path class="curve" d="M0 203 C70 230 93 175 140 178 S230 80 273 78 S325 22 360 26" />
      <circle class="dot" cx="140" cy="178" r="6"/><circle class="dot" cx="273" cy="78" r="7"/><circle class="dot" cx="335" cy="34" r="6"/>
    </svg>
    <div class="content">
      <div class="portrait">
        <!-- Replace the placeholder below with: <img src="profile.jpg" alt="My profile picture"> -->
        <div class="portrait-placeholder">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><circle cx="32" cy="23" r="11"/><path d="M11 55c1-14 9-21 21-21s20 7 21 21"/></svg>
          Your photo here
        </div>
      </div>
      <div class="copy">
        <p class="eyebrow">Data &nbsp;•&nbsp; Insights &nbsp;•&nbsp; Impact</p>
        <h1>Data Analytics &amp;<span>Visualization Expert</span></h1>
        <p class="subtitle">Turning Complex Data into Clear Insights | BI &amp; Data Storytelling</p>
        <div class="features">
          <div class="feature"><svg viewBox="0 0 36 36"><path d="M5 30V21h5v9M16 30V13h5v17M27 30V5h5v25"/></svg><span>Analyze<br>Complex Data</span></div>
          <div class="feature"><svg viewBox="0 0 36 36"><path d="M13 26h10M15 31h6M13 22c-3-2-5-5-5-9a10 10 0 0 1 20 0c0 4-2 7-5 9l-1 4h-8zM18 1v2M3 13h2M31 13h2"/></svg><span>Find<br>Meaningful Insights</span></div>
          <div class="feature"><svg viewBox="0 0 36 36"><circle cx="17" cy="19" r="13"/><circle cx="17" cy="19" r="7"/><path d="M17 19L33 3M26 3h7v7"/></svg><span>Create<br>Real Business Impact</span></div>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
